name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is what QGIS 3.22 LTR ships on the oldest platforms we claim to
        # support; 3.12 is our development reference (QGIS 3.44 LTR). Anything
        # that parses on both parses everywhere in between.
        python-version: ['3.9', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile — syntax must hold on every supported interpreter
        run: python -m compileall -q align_connector

      - name: Lint
        run: |
          python -m pip install --quiet ruff==0.6.9
          ruff check align_connector scripts

      # The uploader decides where to resume, when to retry and when to stop.
      # Its transport is injectable, so those decisions are testable without
      # QGIS and without a network — which is the only reason a three-hour
      # failure mode can be checked in seconds, on every push.
      - name: Resumable upload behaviour
        run: python scripts/smoke_uploader.py

      # A raster publish decides, before any byte moves, whether the layer has
      # a file worth sending as it is, whether that file is the user's own (so
      # nothing may delete it), and whether the layer is a dataset at all. The
      # QGIS classes are stubbed; those four judgements are not.
      - name: Raster publish decisions
        run: python scripts/smoke_raster.py

      # Before a transfer, the dialog says what the organization can still
      # spend, and a refusal for space or credits repeats it. The transport is
      # canned; the reading of ALIGN's answer and the two sentences are not.
      - name: Capacity line and capacity refusals
        run: python scripts/smoke_capacity.py

      # A 308 from the store is progress, a 4xx is a verdict, and only a
      # transport failure is an error. That reading is shared by the API calls
      # and by every chunk of a resumable upload; the Qt transport itself can
      # only be proven in QGIS.
      - name: Network answers
        run: python scripts/smoke_net.py

      # Every vector leaves in WGS 84: a layer already there is untouched, any
      # other system is converted and announced, no system at all is refused
      # before a byte moves. The transformation is QGIS'; the decision is ours.
      - name: Coordinates leave in WGS 84
        run: python scripts/smoke_crs.py

      # The layer's symbology travels as ALIGN's canonical style, and what
      # has no web equivalent is named before the send. Renderers are
      # stand-ins answering the QGIS method names; the decisions are real.
      - name: Symbology converted, simplifications reported
        run: python scripts/smoke_symbology.py

      # The layer's metadata fills the item's ISO sheet on ALIGN: the fields
      # the sheet shows, nothing else; what the organization keeps as its own
      # is named after the publish.
      - name: Metadata read for the item sheet
        run: python scripts/smoke_isometa.py

      # The panel decides which layers it lists (every one, with a reason for
      # those it cannot send), what one click sends (checked rows, panel
      # order, own titles) and what a finished publication is told. Widgets
      # need QGIS; these decisions do not.
      - name: Panel decisions and outcomes
        run: python scripts/smoke_panel.py

      # A layer remembers the item it became; the next publish replaces it
      # in place, in its organization only, unless asked for a new item; a
      # replacement names what changed in the fields (TCK-2218).
      - name: Publication memory and replacement
        run: python scripts/smoke_memory.py

      # One click copies what a bug report needs (versions, addresses, the
      # last refusals with ALIGN's codes), in English, and masks anything
      # shaped like a token or an e-mail address (TCK-2219).
      - name: Diagnostic for a bug report
        run: python scripts/smoke_diagnostic.py

      # A finished lot becomes one request for the web map that shows it:
      # the successful items only, in the panel's order, with visibility,
      # geometry and style, and the camera the canvas showed. The follower
      # that waits for the last task, and the reading of ALIGN's answer.
      - name: Web map from a finished lot
        run: python scripts/smoke_webmap.py

      # A file the viewer reads as it is leaves as it is: FlatGeobuf and
      # GeoParquet already in WGS 84, PMTiles and MBTiles archives. The
      # decisions (extension, system, selection, archive source, tile layers)
      # are proven without QGIS; the bytes are the user's own.
      - name: Cloud-native files leave as they are
        run: python scripts/smoke_cloud.py

      # A layer that is a service (XYZ, WMS, WMTS, WFS, OGC API Features,
      # ArcGIS, vector tiles, remote COG, point cloud, 3D Tiles) becomes a
      # live reference: the reading of what QGIS holds, per provider, and
      # what cannot be a reference, named.
      - name: Services become live references
        run: python scripts/smoke_services.py

      # A vector layer published as an editable feature service (TCK-2320):
      # the layer ALIGN is asked to publish, the job followed to its end, the
      # result in words, the OAPIF source (no credential in it, TCK-2348), the
      # refusals, and a batch whose vector layers become new services, never
      # replacements.
      - name: Layers become editable feature services
        run: python scripts/smoke_feature_service.py

      # Where the plugin's token may go (TCK-2348, CA-10): only the exact
      # origin of the API and a feature service's OGC path; never a
      # neighbouring origin, another route, or a path that walks out.
      - name: The request signer signs only ALIGN's service requests
        run: python scripts/smoke_request_signer.py

      # The service layers' decisions (TCK-2348): what a layer remembers of
      # its service, the names, the Services tab's model, the two reads and
      # their refusals, and the session feeding the signer.
      - name: Service layers, Services tab, session
        run: python scripts/smoke_service_layers.py

      # Every sentence of the source is in the .ts, translated, and the
      # shipped .qm is the compilation of that .ts (TCK-2183). The Qt
      # round trip (scripts/smoke_i18n.py) needs a QGIS and runs on the
      # QGIS images (TCK-2180).
      - name: Translations complete and compiled
        run: python scripts/translations.py check

  # The plugin on a real QGIS, twice: the 3.44 LTR (Qt5) the code is
  # developed against, and the 4.x line (Qt6) users have since 2026-03. The
  # smokes above prove the logic on stand-ins; these load the plugin for real
  # (TCK-2180). Tags per hub.docker.com/r/qgis/qgis: `ltr` = 3.44.x, `4.2` =
  # the Qt6 release line.
  qgis:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['ltr', '4.2']
    container:
      image: qgis/qgis:${{ matrix.image }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: QGIS and Qt versions
        run: python3 -c "from qgis.core import Qgis; from qgis.PyQt.QtCore import QT_VERSION_STR, PYQT_VERSION_STR; print(Qgis.QGIS_VERSION, 'Qt', QT_VERSION_STR, 'PyQt', PYQT_VERSION_STR)"

      - name: Every module imports on this binding
        run: python3 -c "import pkgutil, importlib, align_connector; [importlib.import_module(m.name) for m in pkgutil.walk_packages(align_connector.__path__, 'align_connector.')]; print('all modules import')"

      - name: Plugin loads, registers and unloads on real Qt
        run: python3 scripts/smoke_lifecycle.py

      - name: The shipped translation loads in a real QTranslator
        run: python3 scripts/smoke_i18n.py

      - name: The Processing provider registers and refuses what it must
        run: python3 scripts/smoke_processing.py

      # TCK-2348 — real requests through QGIS' network manager and a real
      # OAPIF layer, against a local stand-in of ALIGN's facade.
      - name: The signer signs inside QGIS, and nowhere else
        run: python3 scripts/smoke_signer_qgis.py

      - name: Service layers end to end (names, menu, no credential in the project, sign-in)
        run: python3 scripts/smoke_service_layers_qgis.py

  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # metadata.txt is what the QGIS plugin repository validates on submission.
      # Catching a missing field here costs seconds; catching it at submission
      # costs a review round trip.
      - name: Validate metadata.txt
        run: python scripts/check_metadata.py

      # The zip a release ships is built and verified here on every push, so
      # a tag never discovers a packaging error (TCK-2047). The XML printed
      # alongside is what the beta repository serves.
      - name: Build the plugin zip and the repository XML
        run: |
          mkdir -p dist
          python scripts/package.py --repository-xml https://aligngeo.com/qgis > dist/plugins.xml
          python -c "import xml.dom.minidom; xml.dom.minidom.parse('dist/plugins.xml'); print('plugins.xml well-formed')"
